<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Risk Monitor</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="menu">
        <button id="menu-button" class="menu-button" aria-label="選單" aria-expanded="false" aria-controls="menu-panel">
          <span></span><span></span><span></span>
        </button>
        <nav id="menu-panel" class="menu-panel" hidden>
          <a href="/">即時監控</a>
          <a href="/collect">收集範例</a>
        </nav>
      </div>
      <h1>Visual Risk Monitor <span class="sub">即時監控</span></h1>
    </div>
    <div class="chips">
      <span class="chip" id="chip-source">來源：—</span>
      <span class="chip" id="chip-encoder">模型：—</span>
    </div>
  </header>

  <main class="grid monitor-grid">
    <!-- 影像 -->
    <section class="card video-card">
      <div class="card-head">
        <h2>影像</h2>
        <div class="controls">
          <select id="source-select"></select>
          <select id="video-select" hidden></select>
          <button id="btn-source-start" class="primary">開啟</button>
          <button id="btn-source-stop">關閉</button>
        </div>
      </div>
      <div class="video-wrap">
        <img id="video" alt="即時影像" hidden>
        <div id="video-placeholder" class="placeholder">影像來源未啟動</div>
      </div>
      <div class="meta" id="source-meta"></div>
    </section>

    <!-- 右欄：分數 + 模型資訊 -->
    <div class="side">
      <section class="card score-card">
        <h2>風險分數</h2>
        <div class="score-value" id="score-value">--</div>
        <div class="score-level" id="score-level">NOT READY</div>
        <div class="score-bar">
          <div class="score-bar-track" id="score-track"></div>
          <div class="score-bar-marker" id="score-marker"></div>
        </div>
        <div class="score-scale" id="score-scale"></div>
        <div class="reason" id="score-reason"></div>

        <div class="nearest">
          <div class="nearest-title">最像的範例</div>
          <div class="nearest-body">
            <img id="nearest-thumb" alt="" hidden>
            <div id="nearest-info" class="muted">—</div>
          </div>
        </div>
        <div class="meta" id="score-meta"></div>
      </section>

      <section class="card model-card">
        <h2>模型資訊</h2>
        <dl class="info-list" id="model-info"></dl>
        <div class="meta" id="model-note"></div>
      </section>

      <!-- 時間軸 -->
      <section class="card timeline-card">
        <div class="card-head">
          <h2>分數時間軸</h2>
          <div class="controls">
            <button id="btn-monitor-toggle" class="primary">開始分析</button>
            <button id="btn-reset">清除時間軸</button>
          </div>
        </div>
        <div class="timeline-wrap"><canvas id="timeline"></canvas></div>
      </section>
    </div>

  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/assets/common.js"></script>
  <script src="/assets/monitor.js"></script>
</body>

</html>
